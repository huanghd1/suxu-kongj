<style>
  :root { color-scheme: dark; }
  html { block-size: 100%; }
  @supports (block-size: 100dvb) { html { block-size: 100dvb; } }
  body {
    block-size: 100%;
    margin: 0;
    overflow: hidden;
    background: #02030a;
    color: #cfe0ff;
    font: 500 12px/1.5 ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;

  }
  /* canvas 默认是 inline，会在整页留下基线缝隙；显式 block 撑满视口 */
  #scene {
    display: block;
    inline-size: 100%;
    block-size: 100%;
    touch-action: none;
    cursor: grab;
  }
  body.dragging #scene { cursor: grabbing; }

  #hint {
    position: fixed;
    inset-inline: 0;
    inset-block-end: max(16px, env(safe-area-inset-bottom));
    margin-inline: auto;
    inline-size: fit-content;
    max-inline-size: calc(100% - 24px);
    padding: 6px 14px;
    border: 1px solid rgb(140 200 255 / 0.16);
    border-radius: 999px;
    background: rgb(6 12 28 / 0.42);
    backdrop-filter: blur(6px);
    letter-spacing: 0.04em;
    color: rgb(200 224 255 / 0.8);
    text-align: center;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    z-index: 6;
  }
  #hint b { color: #7fe3ff; font-weight: 600; }

  /* ---- 左上：知识流读数（定住的“知识终端”） ---- */

    position: fixed;
    inset-block-start: 22px;
    inset-inline-start: 22px;
    inline-size: 322px;
    max-inline-size: calc(100% - 44px);
    padding: 12px 14px 11px;
    border: 1px solid rgb(120 190 255 / 0.16);
    border-radius: 12px;
    background: linear-gradient(180deg, rgb(8 14 30 / 0.66), rgb(5 9 20 / 0.44));
    backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgb(0 0 0 / 0.22), 0 18px 40px rgb(0 0 0 / 0.32);
    font: 400 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    color: rgb(198 220 255 / 0.72);
    pointer-events: none;
    z-index: 6;
  }
  #kb .kb-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 9.5px;
    letter-spacing: 0.16em;
    color: rgb(150 200 255 / 0.5);
  }
  #kb .kb-dot {
    inline-size: 5px;
    block-size: 5px;
    border-radius: 50%;
    background: #5eead4;
    box-shadow: 0 0 8px #5eead4;
    animation: kbPulse 2.4s ease-in-out infinite;

  @keyframes kbPulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  #kb .kb-head em { margin-inline-start: auto; font-style: normal; color: rgb(120 200 255 / 0.42); }
  #kb .kb-name {
    margin-block-start: 7px;
    font: 600 15px/1.3 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

  }
  #kb .kb-formula {
    margin-block-start: 3px;
    font: 500 15px/1.35 ui-monospace, Consolas, monospace;
    color: #7fe3ff;
    text-shadow: 0 0 14px rgb(80 200 255 / 0.45);
    word-break: break-word;
  }
  #kb .kb-desc {
    margin-block-start: 5px;
    font-size: 10.5px;
    line-height: 1.55;
    color: rgb(160 190 230 / 0.55);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  #kb .kb-bar {
    margin-block-start: 9px;
    block-size: 2px;
    background: rgb(120 190 255 / 0.12);
    border-radius: 2px;
    overflow: hidden;
  }
  #kb .kb-bar i {
    display: block;
    block-size: 100%;
    inline-size: 0%;
    background: linear-gradient(90deg, rgb(94 234 212 / 0.15), #5eead4);
  }
  #kb .kb-foot {
    margin-block-start: 7px;
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: rgb(130 160 200 / 0.42);
    letter-spacing: 0.04em;
  }
  #kb.flash .kb-name,
  #kb.flash .kb-formula { animation: kbIn 0.5s ease-out; }
  @keyframes kbIn {
    from { opacity: 0.15; transform: translateY(-2px); }

  }

  /* ---- 右侧：知识检视（点知识卡后弹出的三维坐标视窗） ---- */
  #insp {
    position: fixed;
    inset-inline-end: 24px;

    inline-size: 428px;
    max-inline-size: calc(100% - 48px);

    overflow: auto;
    overflow-x: hidden;
    padding: 13px 15px 12px;
    border: 1px solid rgb(120 190 255 / 0.2);
    border-radius: 16px;
    background: linear-gradient(180deg, rgb(8 13 28 / 0.92), rgb(4 7 16 / 0.88));
    backdrop-filter: blur(16px);
    box-shadow: 0 0 0 1px rgb(0 0 0 / 0.3), 0 26px 60px rgb(0 0 0 / 0.5);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s;
    pointer-events: none;
    z-index: 7;
  }
  #insp.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(-50%) scale(1);
    pointer-events: auto;

  #insp .insp-head {
    display: flex;

  #insp h2 {

  #plot {

<script>
if (!window.THREE) {
  window.__DTU_CDN_FAIL = true;
  window.__dtuFallback();
} else {
/* ============================================================================
 *  dong-ter-uno · 3D 空间穿越 —— 前景原型（单文件 / 无构建）
 *
 *  结构：CONFIG → 天空 → 流光路径 → 知识流 → 宇航员 → 相机与控制 → 主循环
 *  控制：W/S、滚轮、上下拖拽 = 前进/后退；V = 第一/第三人称
 *  知识流：61 个知识点（名称/公式/说明）取自「东东坐标系实验室」，
 *        在场景里做成会发光的卡片，沿航道缓缓向前飘；
 *        宇航员比它快，一张张超过，左上角固定读数在超过的瞬间刷新。
 *  替换说明：
 *   1) 天空盒：把 CONFIG.SKYBOX_PATH 指向 dong-ter-uno 的天空贴图
 *      （2:1 等距柱状投影的 jpg/png；六面图用 CONFIG.SKYBOX_FACES）。
 *      留空 = 内置程序化深空天空（星点 + 银河带 + 远处地球）。
 *   2) 宇航员：createAstronaut() 里的占位模型挂在 astronautModel 上，
 *      换成 GLB 时把它整体替换即可（模型朝 +Z，身高约 1.9 单位）。
 *      单文件版不带 GLTFLoader；要用 GLB，可以自己把 loader 打包成 UMD 再引入。
 * ========================================================================== */

const THREE = window.THREE;

const CONFIG = {
  /* ---------------- 知识流（数据取自 东东坐标系实验室） ---------------- */
  KNOWLEDGE_FLOW: 22,        // 知识卡沿光轨的流动速度（略小于宇航员速度 → 被一张张超过）
  KNOWLEDGE_CARDS: 9,        // 同时在场景里的知识卡数量
  KNOWLEDGE_AHEAD: 105,      // 出生在前方多远
  KNOWLEDGE_BEHIND: 25,      // 超过身后多远回收

  /* ---------------- 天空（dong-ter-uno） ---------------- */
  SKYBOX_PATH: '',        // 例：'./assets/dong-ter-uno/sky.jpg'（2:1 等距柱状图；.hdr 需先转 png/jpg）
  SKYBOX_FACES: null,     // 例：{ px:'…/px.jpg', nx:'…', py:'…', ny:'…', pz:'…', nz:'…' }
  SKY_RADIUS: 3000,
  SKY_TINT: { zenith: 0x02040e, nadir: 0x000104, band: 0x223066 },
  STAR_COUNT: 3400,
  GALAXY_COUNT: 12000,    // 银河带的点云密度
  GALAXY_TILT: 0.85,      // 银河带倾角（弧度）
  SHOW_DISTANT_PLANET: true,
  EARTH_RADIUS: 170,      // 远处地球的半径（视觉大小，不是真实比例）

  /* ---------------- 流光路径 ---------------- */
  LANE_COUNT: 3,
  LANE_COLORS: [0x1ec8ff, 0xa855ff, 0xffd7a3],   // 青蓝 / 紫粉 / 暖白
  RIDE_LANE: 1,                                  // 宇航员走中间那条
  LOOP_RADIUS_X: 210,     // 环路横向半径
  LOOP_RADIUS_Z: 620,     // 环路纵向半径（“向前延伸”的主方向）
  LANE_OFFSET_X: 10,      // 三条路径之间的横向间隔
  LANE_OFFSET_Y: 1.8,     // 三条路径之间的高度差
  LOOP_WOBBLE: 16,        // 路径的轻微弯曲量
  LOOP_BOB: 6,            // 路径的上下起伏
  CURVE_POINTS: 48,       // CatmullRomCurve3 控制点数量
  CURVE_SEGMENTS: 520,    // 管道细分
  TUBE_RADIUS: 0.10,      // 光带芯径
  TUBE_HALO_RADIUS: 0.24, // 外发光层半径
  TUBE_GLOW_RADIUS: 1.1,  // 最外层柔光半径
  TUBE_GLOW_OPACITY: 0.05,
  TUBE_BANDS: 26,         // 沿路径流动的光带数量（整数，闭合无缝）
  TUBE_FLOW_SPEED: 0.78,  // 光带流动速度（与粒子流同步：约 33 秒一圈）
  TUBE_OPACITY: 1.0,
  TUBE_NEAR_FADE: [2.5, 16.0],  // 近处淡出，避免贴脸的巨大光斑

  /* ---------------- 粒子流 ---------------- */
  PARTICLES_PER_LANE: 620,
  PARTICLE_SAMPLES: 1400,     // 曲线采样表精度
  PARTICLE_FLOW_SPEED: 0.03,  // 每秒前进的整圈比例
  PARTICLE_SIZE: 4.5,

  /* ---------------- 移动 ---------------- */
  AUTO_SPEED: 26,          // 默认自动前进速度（单位/秒）
  RIDE_HOVER: 1.2,         // 宇航员悬浮在光轨上方的高度
  KEY_SPEED: 26,           // W/S 按住时的附加速度
  MAX_FORWARD: 90,         // 手动向前的速度上限
  MAX_REVERSE: 60,         // 手动向后的速度上限
  DRAG_SENSITIVITY: 0.55,  // 拖拽灵敏度：像素 → 速度
  WHEEL_SENSITIVITY: 0.5,  // 滚轮灵敏度
  RELEASE_TAU: 0.45,       // 松手后回归自动速度的时间常数（秒）

  /* ---------------- 相机 ---------------- */
  CAM_DISTANCE: 8.5,       // 第三人称：相机在宇航员后方的距离
  CAM_HEIGHT: 2.1,         // 第三人称：相机高度
  CAM_LOOK_AHEAD: 14,      // 第三人称：注视点前移
  CAM_LERP: 7.5,           // 相机跟随阻尼
  FP_EYE_HEIGHT: 1.18,     // 第一人称：眼高（相对宇航员髋部原点，约在头盔中心）
  FP_LOOK_AHEAD: 40,
  FOV: 62
};

const TAU = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;

/* ============================ 渲染器 / 场景 ============================ */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.FOV, 1, 0.1, 9000);

/* ================================ 天空 ================================ */

const skyGroup = new THREE.Group();
skyGroup.name = 'dong-ter-uno-sky';
skyGroup.renderOrder = -100;
scene.add(skyGroup);

const skyUniforms = {
  uZenith: { value: new THREE.Color(CONFIG.SKY_TINT.zenith) },
  uNadir: { value: new THREE.Color(CONFIG.SKY_TINT.nadir) },
  uBand: { value: new THREE.Color(CONFIG.SKY_TINT.band) },
  uBandNormal: { value: new THREE.Vector3(0, 1, 0) },
  uTime: { value: 0 }
};

// 银河带的倾角：绕 Z 轴倾斜法线，让银河带斜跨视野（同时让点云沿同一方向压扁）
const bandQuat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), CONFIG.GALAXY_TILT);
skyUniforms.uBandNormal.value.set(0, 1, 0).applyQuaternion(bandQuat).normalize();

const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(CONFIG.SKY_RADIUS, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: false,
    uniforms: skyUniforms,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vDir;
      uniform vec3 uZenith;
      uniform vec3 uNadir;
      uniform vec3 uBand;
      uniform vec3 uBandNormal;
      uniform float uTime;

      void main() {
        vec3 d = normalize(vDir);
        vec3 col = mix(uNadir, uZenith, smoothstep(-0.8, 0.9, d.y));

        // 银河带：沿一条大圆的柔和辉光 + 更亮的核心带（窄，才不会糊满画面）
        float b = dot(d, uBandNormal);
        float band = exp(-pow(b * 7.5, 2.0));
        float core = exp(-pow(b * 20.0, 2.0));
        // 带内极轻的明暗起伏，让辉光不那么“数学”
        float mott = 0.55 + 0.45 * sin(d.x * 4.7 + d.z * 3.1 + uTime * 0.03)
                          * sin(d.y * 6.3 - uTime * 0.021);
        col += uBand * (band * (0.30 + 0.40 * mott) + core * 0.35);

        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  })
);
skyDome.frustumCulled = false;
skyGroup.add(skyDome);

/* ---------------- 星点 + 银河带点云 ---------------- */

const starUniforms = {
  uTime: { value: 0 },
  uPixelRatio: { value: renderer.getPixelRatio() }
};

const starVertex = /* glsl */`
  attribute float aSize;
  attribute float aSeed;
  attribute vec3 aColor;
  uniform float uTime;
  uniform float uPixelRatio;
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vColor = aColor;
    float tw = 0.62 + 0.38 * sin(uTime * (0.5 + aSeed * 1.7) + aSeed * 21.0);
    vAlpha = tw;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = aSize * uPixelRatio * (0.8 + 0.35 * tw);
  }
`;

const starFragment = /* glsl */`
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vec2 p = gl_PointCoord - 0.5;
    float d = dot(p, p);
    float a = smoothstep(0.25, 0.0, d);
    gl_FragColor = vec4(vColor, a * vAlpha);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

function buildStarGeometry(count, radius, bandiness, sizeMin, sizeMax, palette) {
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  const seeds = new Float32Array(count);
  const c = new THREE.Color();
  const dir = new THREE.Vector3();

  for (let i = 0; i < count; i++) {
    // 球面均匀采样
    const u = Math.random() * 2 - 1;
    const th = Math.random() * TAU;
    const r = Math.sqrt(1 - u * u);
    dir.set(r * Math.cos(th), u, r * Math.sin(th));

    if (bandiness > 0) {
      // 向“赤道带”压扁，再整体倾斜，形成银河带
      dir.y *= 0.14;
      dir.normalize().applyQuaternion(bandQuat);
    }

    dir.multiplyScalar(radius);
    positions[i * 3] = dir.x;
    positions[i * 3 + 1] = dir.y;
    positions[i * 3 + 2] = dir.z;

    c.set(palette[(Math.random() * palette.length) | 0]);
    const v = 0.55 + Math.random() * 0.45;
    colors[i * 3] = c.r * v;
    colors[i * 3 + 1] = c.g * v;
    colors[i * 3 + 2] = c.b * v;

    sizes[i] = sizeMin + Math.random() * (sizeMax - sizeMin);
    seeds[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  return geo;
}

function makePoints(geo, blending = THREE.AdditiveBlending) {
  const mat = new THREE.ShaderMaterial({
    uniforms: starUniforms,
    vertexShader: starVertex,
    fragmentShader: starFragment,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    blending
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  // 星点在 2800+ 之外：保留深度测试，才不会“穿过”宇航员画到前面
  points.renderOrder = -50;
  points.material.depthTest = true;
  return points;
}

/* ---------------- 远处地球（程序化地球，移植自 dong-ter-uno 的 src/sky/bodies.js） ---------------- */
// 大陆/海洋/冰盖/云层 + 海洋高光 + 大气边缘散射 + 夜面城市灯光

const NOISE_GLSL = /* glsl */`
  float hash3(vec3 p) {
    p = fract(p * 0.3183099 + 0.1);
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
  }
  float vnoise(vec3 x) {
    vec3 i = floor(x);
    vec3 f = fract(x);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
      mix(mix(hash3(i + vec3(0, 0, 0)), hash3(i + vec3(1, 0, 0)), f.x),
          mix(hash3(i + vec3(0, 1, 0)), hash3(i + vec3(1, 1, 0)), f.x), f.y),
      mix(mix(hash3(i + vec3(0, 0, 1)), hash3(i + vec3(1, 0, 1)), f.x),
          mix(hash3(i + vec3(0, 1, 1)), hash3(i + vec3(1, 1, 1)), f.x), f.y),
      f.z);
  }
  float fbm(vec3 p) {
    float a = 0.5, s = 0.0;
    for (int i = 0; i < 6; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; }
    return s;
  }
`;

let earthMesh = null;
let earthMat = null;
const earthSunWorld = new THREE.Vector3(0.96, 0.14, 0.16).normalize();

if (CONFIG.SHOW_DISTANT_PLANET) {
  earthMat = new THREE.ShaderMaterial({
    uniforms: {
      uSunDir: { value: earthSunWorld.clone() },  // 地球局部坐标
      uTime: { value: 0 },
      uIntensity: { value: 0.95 }
    },
    vertexShader: /* glsl */`
      uniform vec3 uSunDir;
      varying vec3 vObjNormal, vViewNormal, vViewPos, vSunView;
      void main() {
        vObjNormal = normalize(position);
        vSunView = normalize((modelViewMatrix * vec4(uSunDir, 0.0)).xyz);
        vViewNormal = normalize(normalMatrix * normal);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vViewPos = mv.xyz;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uSunDir;
      uniform float uTime, uIntensity;
      varying vec3 vObjNormal, vViewNormal, vViewPos, vSunView;
      ${NOISE_GLSL}
      void main() {
        vec3 n = normalize(vObjNormal);
        float land = smoothstep(0.52, 0.56, fbm(n * 2.2 + 4.0));
        float lat = abs(n.y);
        float ice = smoothstep(0.78, 0.86, lat + fbm(n * 6.0) * 0.12);
        vec3 ocean = vec3(0.01, 0.05, 0.16);
        vec3 ground = mix(vec3(0.12, 0.16, 0.06), vec3(0.32, 0.25, 0.14), fbm(n * 8.0));
        vec3 albedo = mix(mix(ocean, ground, land), vec3(0.85), ice);
        vec3 cn = n + vec3(uTime * 0.004, 0.0, 0.0);
        float cloud = smoothstep(0.5, 0.75, fbm(cn * 3.5 + 11.0) * 0.7 + fbm(cn * 12.0) * 0.4);
        albedo = mix(albedo, vec3(0.95), cloud * 0.9);

        float ndl = dot(n, uSunDir);
        float day = smoothstep(-0.08, 0.25, ndl);
        vec3 col = albedo * max(ndl, 0.0) * 2.2;
        // 海洋太阳高光
        vec3 V = normalize(-vViewPos);
        vec3 vn = normalize(vViewNormal);
        vec3 H = normalize(normalize(vSunView) + V);
        col += vec3(1.0, 0.9, 0.75) * pow(max(dot(vn, H), 0.0), 60.0) * (1.0 - land) * (1.0 - cloud) * day * 1.5;
        // 夜面城市灯光
        float city = smoothstep(0.62, 0.8, fbm(n * 30.0)) * land * (1.0 - ice);
        col += vec3(1.0, 0.65, 0.3) * city * (1.0 - day) * 0.35;
        // 大气：边缘菲涅尔 + 晨昏线暖色
        float fres = pow(1.0 - max(dot(vn, V), 0.0), 3.0);
        vec3 atm = mix(vec3(0.3, 0.55, 1.0), vec3(1.0, 0.55, 0.3), smoothstep(0.25, -0.05, ndl) * step(-0.15, ndl));
        col += atm * fres * smoothstep(-0.2, 0.35, ndl) * 1.6;
        gl_FragColor = vec4(col * uIntensity, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  });

  earthMesh = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.EARTH_RADIUS, 96, 48), earthMat);
  earthMesh.name = 'earth';
  earthMesh.rotation.z = 0.41;                 // 黄赤交角
  earthMesh.position.set(-0.52, 0.30, 0.80).normalize().multiplyScalar(CONFIG.SKY_RADIUS * 0.86);
  earthMesh.frustumCulled = false;
  skyGroup.add(earthMesh);
}

async function applyExternalSkybox() {
  const faces = CONFIG.SKYBOX_FACES;
  if (!faces && !CONFIG.SKYBOX_PATH) return false;

  const loadImage = (url) => new Promise((resolve, reject) => {
    new THREE.TextureLoader().load(url, resolve, undefined, reject);
  });

  try {
    let tex;
    if (faces) {
      tex = await new Promise((resolve, reject) => {
        new THREE.CubeTextureLoader().load(
          [faces.px, faces.nx, faces.py, faces.ny, faces.pz, faces.nz],
          resolve, undefined, reject
        );
      });
      tex.colorSpace = THREE.SRGBColorSpace;
    } else if (/\.hdr$/i.test(CONFIG.SKYBOX_PATH)) {
      // 单文件 UMD 版不带 HDR 加载器：请先把 .hdr 转成 2:1 的 jpg/png
      throw new Error('.hdr 需要 RGBELoader，请先转成等距柱状 jpg/png');
    } else {
      tex = await loadImage(CONFIG.SKYBOX_PATH);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.colorSpace = THREE.SRGBColorSpace;
    }
    scene.background = tex;
    scene.environment = tex;
    skyGroup.visible = false;
    return true;
  } catch (err) {
    console.warn('[dong-ter-uno] 外部天空盒加载失败，回退到程序化天空：', err);
    return false;
  }
}

/* ============================== 流光路径 ============================== */

/**
 * 基准回路：超椭圆（圆角矩形）+ 轻微波动，闭合以保证“向前”可以无限继续。
 * 长直道保证“向前延伸”的观感，弯道半径足够大，不会突然甩头。
 */
const baseLoopPoints = (() => {
  const pts = [];
  for (let i = 0; i < CONFIG.CURVE_POINTS; i++) {
    const a = (i / CONFIG.CURVE_POINTS) * TAU;
    const ca = Math.cos(a);
    const sa = Math.sin(a);
    // 指数 < 1 时更接近圆角矩形
    const cx = Math.sign(ca) * Math.pow(Math.abs(ca), 0.62);
    const cz = Math.sign(sa) * Math.pow(Math.abs(sa), 0.62);
    const wob = Math.sin(a * 3) * CONFIG.LOOP_WOBBLE;
    pts.push(new THREE.Vector3(
      cx * CONFIG.LOOP_RADIUS_X + ca * wob,
      Math.sin(a * 2) * CONFIG.LOOP_BOB,
      cz * CONFIG.LOOP_RADIUS_Z + sa * wob
    ));
  }
  return pts;
})();

// 沿基准环路的水平法线偏移 → 三条真正互相平行的路（近处看起来像同一组走廊）
function offsetLoopPoints(base, lateral, vertical) {
  const n = base.length;
  const out = [];
  const tan = new THREE.Vector3();
  const nrm = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < n; i++) {
    tan.subVectors(base[(i + 1) % n], base[(i - 1 + n) % n]).normalize();
    nrm.crossVectors(tan, up).normalize();
    out.push(base[i].clone().addScaledVector(nrm, lateral).addScaledVector(up, vertical));
  }
  return out;
}

function makeLaneCurve(index) {
  const mid = (CONFIG.LANE_COUNT - 1) / 2;
  const t = index - mid;
  const points = offsetLoopPoints(baseLoopPoints, t * CONFIG.LANE_OFFSET_X, t * CONFIG.LANE_OFFSET_Y);
  const curve = new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.5);
  curve.arcLengthDivisions = 1200;
  curve.updateArcLengths();
  return curve;
}

function makeFlowMaterial(color, bands, speed, opacity) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uTime: { value: 0 },
      uBands: { value: bands },
      uSpeed: { value: speed },
      uOpacity: { value: opacity },
      uFade: { value: new THREE.Vector2(CONFIG.TUBE_NEAR_FADE[0], CONFIG.TUBE_NEAR_FADE[1]) }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vWorld;
      void main() {
        vUv = uv;
        vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec2 vUv;
      varying vec3 vWorld;
      uniform vec3 uColor;
      uniform float uTime;
      uniform float uBands;
      uniform float uSpeed;
      uniform float uOpacity;
      uniform vec2 uFade;
      void main() {
        // 沿路径流动的光带：整数条带 → 闭合处无缝
        float f = fract(vUv.x * uBands - uTime * uSpeed);
        float band = pow(sin(f * 3.14159265), 8.0);
        // 逐像素算到相机的距离再淡出，贴着镜头的那一段才不会糊成一大块光斑
        float nearFade = smoothstep(uFade.x, uFade.y, distance(vWorld, cameraPosition));
        float a = (0.30 + band * 0.75) * uOpacity * nearFade;
        vec3 col = uColor * (1.0 + band * 0.15);
        gl_FragColor = vec4(col, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
}

const lanes = [];
const laneUp = new THREE.Vector3(0, 1, 0);

for (let i = 0; i < CONFIG.LANE_COUNT; i++) {
  const color = CONFIG.LANE_COLORS[i % CONFIG.LANE_COLORS.length];
  const curve = makeLaneCurve(i);
  const length = curve.getLength();

  // 最外层柔光（廉价的“假 bloom”）
  const glow = new THREE.Mesh(
    new THREE.TubeGeometry(curve, CONFIG.CURVE_SEGMENTS, CONFIG.TUBE_GLOW_RADIUS, 8, true),
    makeFlowMaterial(color, Math.max(3, Math.round(CONFIG.TUBE_BANDS / 6)), CONFIG.TUBE_FLOW_SPEED * 0.5, CONFIG.TUBE_GLOW_OPACITY)
  );
  glow.frustumCulled = false;
  scene.add(glow);

  // 外层辉光
  const halo = new THREE.Mesh(
    new THREE.TubeGeometry(curve, CONFIG.CURVE_SEGMENTS, CONFIG.TUBE_HALO_RADIUS, 6, true),
    makeFlowMaterial(color, Math.max(3, Math.round(CONFIG.TUBE_BANDS / 3)), CONFIG.TUBE_FLOW_SPEED * 0.7, 0.09)
  );
  halo.frustumCulled = false;
  scene.add(halo);

  // 内核
  const coreMat = makeFlowMaterial(color, CONFIG.TUBE_BANDS, CONFIG.TUBE_FLOW_SPEED, CONFIG.TUBE_OPACITY);
  coreMat.side = THREE.FrontSide; // 单层，避免正反面叠加把颜色冲成白色
  const core = new THREE.Mesh(
    new THREE.TubeGeometry(curve, CONFIG.CURVE_SEGMENTS, CONFIG.TUBE_RADIUS, 6, true),
    coreMat
  );
  core.frustumCulled = false;
  scene.add(core);

  // ---- 沿曲线流动的光点 ----
  const samples = CONFIG.PARTICLE_SAMPLES;
  const table = curve.getSpacedPoints(samples); // samples + 1 个点，首尾基本重合
  const positions = new Float32Array(CONFIG.PARTICLES_PER_LANE * 3);
  const sizes = new Float32Array(CONFIG.PARTICLES_PER_LANE);
  const alphas = new Float32Array(CONFIG.PARTICLES_PER_LANE);
  const phases = new Float32Array(CONFIG.PARTICLES_PER_LANE);
  const offsets = new Float32Array(CONFIG.PARTICLES_PER_LANE * 3);

  const tangent = new THREE.Vector3();
  const n1 = new THREE.Vector3();
  const n2 = new THREE.Vector3();

  for (let p = 0; p < CONFIG.PARTICLES_PER_LANE; p++) {
    const phase = p / CONFIG.PARTICLES_PER_LANE + Math.random() * 0.002;
    phases[p] = phase;
    alphas[p] = 0.35 + Math.random() * 0.65;
    sizes[p] = 0.6 + Math.random() * 0.8;

    // 在管道横截面上给一点随机散开
    const idx = Math.min(samples, Math.round(phase * samples));
    curve.getTangentAt((idx % samples) / samples, tangent);
    n1.crossVectors(laneUp, tangent).normalize();
    n2.crossVectors(tangent, n1).normalize();
    const rad = Math.pow(Math.random(), 1.6) * 1.7;
    const ang = Math.random() * TAU;
    offsets[p * 3] = (n1.x * Math.cos(ang) + n2.x * Math.sin(ang)) * rad;
    offsets[p * 3 + 1] = (n1.y * Math.cos(ang) + n2.y * Math.sin(ang)) * rad;
    offsets[p * 3 + 2] = (n1.z * Math.cos(ang) + n2.z * Math.sin(ang)) * rad;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uSize: { value: CONFIG.PARTICLE_SIZE }
    },
    vertexShader: /* glsl */`
      attribute float aSize;
      attribute float aAlpha;
      uniform float uPixelRatio;
      uniform float uSize;
      varying float vAlpha;
      varying float vDist;
      void main() {
        vAlpha = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vDist = -mv.z;
        gl_Position = projectionMatrix * mv;
        float dist = max(1.0, -mv.z);
        gl_PointSize = uSize * aSize * uPixelRatio * clamp(20.0 / dist, 0.35, 2.0);
      }
    `,
    fragmentShader: /* glsl */`
      uniform vec3 uColor;
      varying float vAlpha;
      varying float vDist;
      void main() {
        vec2 p = gl_PointCoord - 0.5;
        float d = dot(p, p);
        // 贴脸的光点淡出，避免出现大色块
        float nearFade = smoothstep(2.0, 14.0, vDist);
        float a = smoothstep(0.25, 0.0, d) * vAlpha * nearFade;
        gl_FragColor = vec4(uColor * (1.1 + vAlpha * 0.8), a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  scene.add(points);

  lanes.push({
    curve,
    length,
    color,
    core,
    halo,
    glow,
    points,
    geo,
    table,
    phases,
    offsets,
    count: CONFIG.PARTICLES_PER_LANE
  });
}

const KB_TEX_W = 512;
const KB_TEX_H = 144;
const kbTextures = new Map();

// 每个知识点画成一张发光卡片（黑底透明，加色混合下只有字会亮）
function knowledgeTexture(item) {
  const cached = kbTextures.get(item.n);
  if (cached) return cached;

  const cv = document.createElement('canvas');
  cv.width = KB_TEX_W;
  cv.height = KB_TEX_H;
  const g = cv.getContext('2d');

  // 左侧分类色条
  g.globalAlpha = 0.9;
  g.fillStyle = item.c;
  g.fillRect(8, 22, 2.5, KB_TEX_H - 46);

  // 编号
  g.globalAlpha = 0.5;
  g.fillStyle = '#a9c8f0';
  g.font = '600 14px ui-monospace, Consolas, monospace';
  g.fillText(item.n, 22, 34);

  // 名称
  g.globalAlpha = 0.95;
  g.fillStyle = '#e6f0ff';
  g.font = '600 18px "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
  g.fillText(item.name, 52, 34);

  // 公式（超宽自动缩字号）
  let px = 33;
  const fam = 'px ui-monospace, "SF Mono", Consolas, monospace';
  g.font = '500 ' + px + fam;
  while (px > 15 && g.measureText(item.f).width > KB_TEX_W - 36) {
    px -= 1.5;
    g.font = '500 ' + px + fam;
  }
  g.globalAlpha = 1;
  g.fillStyle = item.c;
  g.shadowColor = item.c;
  g.shadowBlur = 16;
  g.fillText(item.f, 22, 84);
  g.shadowBlur = 0;

  // 分类
  g.globalAlpha = 0.42;
  g.fillStyle = '#9db8dd';
  g.font = '400 12px ui-monospace, Consolas, monospace';
  g.fillText(item.g, 22, 116);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  kbTextures.set(item.n, tex);
  return tex;
}

const kbLayer = new THREE.Group();
kbLayer.name = 'knowledge-stream';
scene.add(kbLayer);

const kbCards = [];
const KB_SPAN = CONFIG.KNOWLEDGE_AHEAD + CONFIG.KNOWLEDGE_BEHIND;
const kbInUse = new Set();   // 保证同屏不会出现两张一样的知识点
let kbCursor = 0;

// 取一个当前没被占用的知识点（从游标往后找）
function nextKnowledgeTopic() {
  for (let k = 0; k < KNOWLEDGE.length; k++) {
    kbCursor = (kbCursor + 1) % KNOWLEDGE.length;
    if (!kbInUse.has(kbCursor)) return kbCursor;
  }
  return kbCursor;
}

for (let i = 0; i < CONFIG.KNOWLEDGE_CARDS; i++) {
  const topic = nextKnowledgeTopic();
  kbInUse.add(topic);
  const mat = new THREE.SpriteMaterial({
    map: knowledgeTexture(KNOWLEDGE[topic]),
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    toneMapped: false,
    opacity: 0
  });
  const sprite = new THREE.Sprite(mat);
  const w = 10.4;
  const h = w * (KB_TEX_H / KB_TEX_W);
  sprite.scale.set(w, h, 1);
  sprite.visible = false;
  sprite.renderOrder = 4;
  kbLayer.add(sprite);

  kbCards.push({
    sprite,
    w,
    h,
    topic,
    // 均匀铺在前方：从身后一点点开始
    rel: -CONFIG.KNOWLEDGE_BEHIND * 0.6 + (KB_SPAN * i) / CONFIG.KNOWLEDGE_CARDS,
    lateral: (i % 2 ? 1 : -1) * (3.0 + (i % 3) * 1.5),
    height: 2.2 + (i % 4) * 0.9,
    prevRel: 1
  });
}

const kbEls = {
  root: document.getElementById('kb'),
  idx: document.getElementById('kb-idx'),
  name: document.getElementById('kb-name'),

function setKnowledgeHUD(index) {
  const item = KNOWLEDGE[index];
  kbEls.idx.textContent = item.n + ' / ' + String(KNOWLEDGE.length).padStart(2, '0');
  kbEls.name.textContent = item.name;
  kbEls.formula.textContent = item.f;
  kbEls.desc.textContent = item.d;
  kbEls.group.textContent = item.g;
  kbEls.root.classList.remove('flash');
  void kbEls.root.offsetWidth;   // 触发重排，重播淡入
  kbEls.root.classList.add('flash');
}

const kbPos = new THREE.Vector3();
const kbTan = new THREE.Vector3();
const kbNormal = new THREE.Vector3();

// 知识卡沿航道向前飘，宇航员开得比它快 → 一张张被超过，超过的瞬间刷新读数
function updateKnowledge(dt, speed, time) {
  const len = rideLane.length;
  let nearestRel = Infinity;

  for (const card of kbCards) {
    const flow = state.focus ? 0 : CONFIG.KNOWLEDGE_FLOW;
    card.rel += (flow - speed) * dt;

    if (card.rel < -CONFIG.KNOWLEDGE_BEHIND) {
      card.rel += KB_SPAN;
      kbInUse.delete(card.topic);
      card.topic = nextKnowledgeTopic();
      kbInUse.add(card.topic);
      card.sprite.material.map = knowledgeTexture(KNOWLEDGE[card.topic]);
    } else if (card.rel > CONFIG.KNOWLEDGE_AHEAD) {
      card.rel -= KB_SPAN;
    }

    let u = state.u + card.rel / len;
    u -= Math.floor(u);

    rideLane.curve.getPointAt(u, kbPos);
    rideLane.curve.getTangentAt(u, kbTan).normalize();
    kbNormal.crossVectors(laneUp, kbTan).normalize();

    const bob = Math.sin(time * 0.8 + card.topic) * 0.18;
    card.sprite.position
      .copy(kbPos)
      .addScaledVector(kbNormal, card.lateral)
      .addScaledVector(laneUp, card.height + bob);

    const dist = card.sprite.position.distanceTo(camera.position);
    const fade = THREE.MathUtils.smoothstep(dist, 7, 18) *
                 (1 - THREE.MathUtils.smoothstep(dist, 86, 140));
    card.sprite.material.opacity = fade * 0.95;
    card.sprite.visible = fade > 0.015;

    // 贴脸时缩一缩，免得一整块字糊在镜头上
    const shrink = Math.min(1, dist / 26);
    card.sprite.scale.set(card.w * shrink, card.h * shrink, 1);

    if (card.prevRel > 0 && card.rel <= 0) setKnowledgeHUD(card.topic);
    card.prevRel = card.rel;

    if (card.rel > 0 && card.rel < nearestRel) nearestRel = card.rel;
  }

  if (Number.isFinite(nearestRel)) {
    const p = 1 - Math.min(1, nearestRel / 40);
    kbEls.bar.style.width = (p * 100).toFixed(1) + '%';
  }
}

/* ---------- 基础绘制工具 ---------- */

const plV = (x, y, z) => new THREE.Vector3(x, y, z);

function plLine(pts, color, opacity = 0.95) {
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(g, new THREE.LineBasicMaterial({
    color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false
  }));
}

function plSegments(pairs, color, opacity = 0.28) {
  const g = new THREE.BufferGeometry().setFromPoints(pairs);
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false
  }));
}

function plFunc(fn, x0, x1, n, color, map = null, opacity = 0.95, limit = 9) {
  const out = new THREE.Group();
  let seg = [];
  const flush = () => { if (seg.length > 1) out.add(plLine(seg, color, opacity)); seg = []; };
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n;
    const y = fn(x);
    if (!Number.isFinite(y) || Math.abs(y) > limit) { flush(); continue; }
    seg.push(map ? map(x, y) : plV(x, y, 0));
  }
  flush();
  return out;
}

function plParam(fn, t0, t1, n, color, opacity = 0.95) {
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(fn(t0 + (t1 - t0) * i / n));
  return plLine(pts, color, opacity);
}

function plPoints(list, color, size = 0.1, opacity = 0.95) {
  const g = new THREE.BufferGeometry().setFromPoints(list);
  return new THREE.Points(g, new THREE.PointsMaterial({
    color, size, transparent: true, opacity, blending: THREE.AdditiveBlending,
    depthWrite: false, sizeAttenuation: true
  }));
}

function plBox(cx, cy, cz, w, h, d, color, opacity = 0.5) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({
    color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  m.position.set(cx, cy, cz);
  return m;
}

function plMesh(geo, color, opacity = 0.32) {
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color, wireframe: true, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false
  }));
}

function plSurface(fn, u0, u1, v0, v1, us, vs, color, opacity = 0.26) {
  const pos = [];
  const idx = [];
  for (let i = 0; i <= us; i++) {
    for (let j = 0; j <= vs; j++) {
      const p = fn(u0 + (u1 - u0) * i / us, v0 + (v1 - v0) * j / vs);
      pos.push(p.x, p.y, p.z);
    }
  }
  const row = vs + 1;
  for (let i = 0; i < us; i++) {
    for (let j = 0; j < vs; j++) {
      const a = i * row + j;
      idx.push(a, a + 1, a + row + 1, a, a + row + 1, a + row);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  return plMesh(geo, color, opacity);
}

function plArrow(from, to, color) {
  const dir = to.clone().sub(from);
  const a = new THREE.ArrowHelper(dir.clone().normalize(), from, dir.length(), color, 0.24, 0.12);
  a.line.material.transparent = true;
  a.line.material.opacity = 0.95;
  a.cone.material.transparent = true;
  a.cone.material.opacity = 0.95;
  return a;
}

function plLabel(text, color) {
  const cv = document.createElement('canvas');
  cv.width = 64;
  cv.height = 64;
  const g = cv.getContext('2d');
  g.font = '600 40px ui-monospace, Consolas, monospace';
  g.fillStyle = color;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(text, 32, 34);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false, toneMapped: false
  }));
  s.scale.set(0.44, 0.44, 1);
  return s;
}

function plGrid(size = 3, step = 0.75, color = 0x33518c) {
  const pts = [];
  for (let x = -size; x <= size + 1e-6; x += step) {
    pts.push(plV(x, 0, -size), plV(x, 0, size));
    pts.push(plV(-size, 0, x), plV(size, 0, x));
  }
  return plSegments(pts, color, 0.16);
}

function plAxes(L = 3) {
  const g = new THREE.Group();
  g.add(plArrow(plV(0, 0, 0), plV(L, 0, 0), 0xff7a9c));
  g.add(plArrow(plV(0, 0, 0), plV(0, L, 0), 0x7cf7b0));
  g.add(plArrow(plV(0, 0, 0), plV(0, 0, L), 0x74a8ff));
  const lx = plLabel('X', '#ff9db4'); lx.position.set(L + 0.28, 0.05, 0); g.add(lx);
  const ly = plLabel('Y', '#95ffc0'); ly.position.set(0, L + 0.3, 0); g.add(ly);
  const lz = plLabel('Z', '#9cc3ff'); lz.position.set(0, 0, L + 0.3); g.add(lz);
  return g;
}

/* ---------- 61 个知识点的图形 ---------- */

function buildTopicPlot(n, c) {
  const g = new THREE.Group();
  const dim = 0x7f9dc9;

  switch (n) {
    case '01': { // 集合运算：数轴上的两段区间
      g.add(plSegments([plV(-3.4, 0, 0), plV(3.4, 0, 0)], dim, 0.5));
      g.add(plBox(-0.55, 0, 0.35, 2.2, 0.08, 0.08, c));
      g.add(plBox(0.55, 0, -0.35, 1.7, 0.08, 0.08, 0x9be7c4));
      g.add(plPoints([plV(-1.65, 0, 0.35), plV(0.55, 0, 0.35), plV(-0.3, 0, -0.35), plV(1.4, 0, -0.35)], c, 0.13));
      break;
    }
    case '02': { // 韦恩图
      g.add(plParam(t => plV(Math.cos(t) * 1.55 - 0.85, Math.sin(t) * 1.55, 0), 0, Math.PI * 2, 120, c));
      g.add(plParam(t => plV(Math.cos(t) * 1.55 + 0.85, Math.sin(t) * 1.55, 0), 0, Math.PI * 2, 120, 0x9be7c4, 0.75));
      g.add(plParam(t => plV(Math.cos(t) * 1.55, Math.sin(t) * 1.55, 0), 0, Math.PI * 2, 120, 0xffffff, 0.18));
      break;
    }
    case '03': { // 子集个数 2^n
      const pts = [];
      for (let k = 0; k <= 6; k++) pts.push(plV(k - 3, Math.pow(2, k) / 16, 0));
      const curve = [];
      for (let i = 0; i <= 80; i++) {
        const x = i / 80 * 6;
        curve.push(plV(x - 3, Math.pow(2, x) / 16, 0));
      }
      g.add(plLine(curve, c, 0.5));
      g.add(plPoints(pts, c, 0.15));
      break;
    }
    case '04': { // 逻辑联结词：真值表
      const vals = [1, 1, 1, 0, 1, 0, 0, 0];
      vals.forEach((v, i) => {
        const x = (i % 4) - 1.5;
        const z = Math.floor(i / 4) ? -0.6 : 0.6;
        g.add(plBox(x, v * 0.5, z, 0.5, Math.max(0.06, v * 1.0), 0.5, v ? c : 0x415a80, v ? 0.55 : 0.35));
      });
      break;
    }
    case '05': // 一次函数
      g.add(plFunc(x => 0.95 * x - 0.7, -3, 3, 40, c));
      g.add(plSegments([plV(-3, 0, 0), plV(3, 0, 0)], dim, 0.35));
      break;
    case '06': // 二次函数
      g.add(plFunc(x => 0.42 * (x * x) - 1.6, -3, 3, 70, c));
      g.add(plPoints([plV(-1.95, 0, 0), plV(1.95, 0, 0), plV(0, -1.6, 0)], c, 0.13));
      break;
    case '07': // 整式化简 (x+p)(x+q)
      g.add(plFunc(x => 0.55 * (x + 1) * (x - 2) + 0.4, -2.8, 2.8, 70, c));
      g.add(plSegments([plV(-1, -2.2, 0), plV(-1, 0.5, 0), plV(2, -2.2, 0), plV(2, 0.4, 0)], dim, 0.3));
      break;
    case '08': // 指数函数
      g.add(plFunc(x => Math.pow(2, x) * 0.55 - 0.6, -2.6, 2.2, 70, c));
      break;
    case '09': // 幂函数
      g.add(plFunc(x => Math.pow(Math.abs(x), 1.5) * Math.sign(x) * 0.85, -2.6, 2.6, 70, c));
      g.add(plFunc(x => Math.pow(Math.abs(x), 0.55) * Math.sign(x) * 0.9, -2.6, 2.6, 70, 0x9be7c4, null, 0.6));
      break;
    case '10': // 对数函数
      g.add(plFunc(x => Math.log(x + 2.4) * 1.1 - 1.2, -2, 3, 70, c));
      break;
    case '11': { // 导数与切线
      const f = x => 0.32 * x * x * x - 0.9 * x;
      const k = 0.96 * 1.5 * 1.5 - 0.9;
      g.add(plFunc(f, -2.6, 2.6, 80, c));
      g.add(plFunc(x => f(1.5) + k * (x - 1.5), 0.2, 2.7, 20, 0xff9db4, null, 0.85));
      g.add(plPoints([plV(1.5, f(1.5), 0)], 0xffffff, 0.16));
      break;
    }
    case '12': // 正弦型函数
      g.add(plFunc(x => Math.sin(1.45 * x) * 1.7, -3, 3, 120, c));
      break;
    case '13': // 余弦型函数
      g.add(plFunc(x => Math.cos(1.45 * x) * 1.7, -3, 3, 120, c));
      break;
    case '14': // 正切型函数
      g.add(plFunc(x => Math.tan(0.85 * x) * 0.8, -3, 3, 240, c, null, 0.95, 3.2));
      break;
    case '15': // 辅助角公式
      g.add(plFunc(x => Math.sin(x) * 1.2, -3, 3, 120, 0x9be7c4, null, 0.5));
      g.add(plFunc(x => Math.cos(x) * 1.2, -3, 3, 120, 0x9cc3ff, null, 0.5));
      g.add(plFunc(x => (Math.sin(x) + Math.cos(x)) * 1.2, -3, 3, 120, c));
      break;
    case '16': { // 解三角形
      const A = plV(-1.9, -1.1, 0), B = plV(1.9, -1.1, 0), C = plV(-0.4, 1.7, 0);
      g.add(plLine([A, B, C, A], c));
      g.add(plPoints([A, B, C], 0xffffff, 0.12));
      break;
    }
    case '17': { // 向量的坐标运算
      g.add(plArrow(plV(0, 0, 0), plV(2, 0, 1.2), c));
      g.add(plArrow(plV(0, 0, 0), plV(-1.1, 0, 1.9), 0x9be7c4));
      g.add(plArrow(plV(2, 0, 1.2), plV(0.9, 0, 3.1), 0x9cc3ff, 0.8));
      break;
    }
    case '18': { // 向量的模
      g.add(plArrow(plV(0, 0, 0), plV(2.2, 0, 1.4), c));
      g.add(plSegments([plV(2.2, 0, 1.4), plV(2.2, 0, 0), plV(2.2, 0, 0), plV(0, 0, 1.4)], dim, 0.35));
      break;
    }
    case '19': { // 数量积与夹角
      g.add(plArrow(plV(0, 0, 0), plV(2.4, 0, 0.4), c));
      g.add(plArrow(plV(0, 0, 0), plV(1.0, 0, 2.2), 0x9be7c4));
      g.add(plParam(t => plV(Math.cos(t) * 0.8, 0, Math.sin(t) * 0.8), 0.16, 1.15, 30, 0xffffff, 0.5));
      break;
    }
    case '20': { // 等差数列
      const p = [];
      for (let k = 0; k < 7; k++) p.push(plV(k - 3, 0.5 * k - 1.6, 0));
      g.add(plPoints(p, c, 0.15));
      g.add(plLine(p, c, 0.35));
      break;
    }
    case '21': { // 等比数列
      const p = [];
      for (let k = 0; k < 7; k++) p.push(plV(k - 3, Math.pow(1.45, k) * 0.22 - 0.5, 0));
      g.add(plPoints(p, c, 0.15));
      g.add(plLine(p, c, 0.35));
      break;
    }
    case '22': { // 一元一次不等式：射线
      g.add(plSegments([plV(-3.3, 0, 0), plV(3.3, 0, 0)], dim, 0.4));
      g.add(plBox(1.55, 0, 0, 3.5, 0.09, 0.09, c, 0.8));
      g.add(plPoints([plV(-0.2, 0, 0)], 0xffffff, 0.14));
      break;
    }
    case '23': { // 一元二次不等式
      g.add(plFunc(x => 0.5 * (x * x) - 1.5, -2.7, 2.7, 70, c));
      for (let x = -2.4; x <= 2.4; x += 0.24) {
        const y = 0.5 * x * x - 1.5;
        if (y > 0) g.add(plBox(x, y / 2, 0, 0.05, y, 0.05, c, 0.22));
      }

    }
    case '24': { // 基本不等式
      g.add(plBox(-1.0, 0.9, 0, 0.24, 1.8, 0.24, c, 0.55));
      g.add(plBox(0.4, 0.9, 0, 0.24, 1.8, 0.24, 0x9be7c4, 0.55));
      g.add(plBox(1.6, 1.1, 0, 0.24, 2.2, 0.24, 0x9cc3ff, 0.4));

    }
    case '25': { // 空间向量的模

      g.add(plSegments([p, plV(p.x, 0, p.z), plV(p.x, 0, 0), plV(p.x, 0, p.z), plV(0, 0, p.z)], dim, 0.4));

    case '26': { // 空间两点距离
      const A = plV(-1.7, -0.9, -1.2), B = plV(1.6, 1.4, 1.5);
      g.add(plLine([A, B], c));
      g.add(plPoints([A, B], 0xffffff, 0.16));
      g.add(plSegments([A, plV(B.x, A.y, A.z), plV(B.x, A.y, A.z), B, A, plV(A.x, B.y, A.z), plV(A.x, B.y, A.z), B], dim, 0.28));

    case '27': { // 线面角

      g.add(plSegments([plV(-1.5, 0, -1.5), plV(1.4, 0, 1.3)], dim, 0.4));

    case '28': { // 正多边形
      const p = [];
      for (let k = 0; k <= 6; k++) p.push(plV(Math.cos(k / 6 * Math.PI * 2) * 1.9, Math.sin(k / 6 * Math.PI * 2) * 1.9, 0));
      g.add(plLine(p, c));
      g.add(plParam(t => plV(Math.cos(t) * 1.9, Math.sin(t) * 1.9, 0), 0, Math.PI * 2, 90, 0xffffff, 0.15));

    case '29': // 圆柱
      g.add(plMesh(new THREE.CylinderGeometry(1.3, 1.3, 2.4, 14, 3, true), c, 0.35));
      break;
    case '30': // 圆锥
      g.add(plMesh(new THREE.ConeGeometry(1.5, 2.6, 16, 4, true), c, 0.35));
      break;
    case '31': // 圆台
      g.add(plMesh(new THREE.CylinderGeometry(0.8, 1.6, 2.2, 16, 3, true), c, 0.35));
      break;
    case '32': // 球体
      g.add(plMesh(new THREE.SphereGeometry(1.7, 18, 12), c, 0.3));
      break;
    case '33': // 正棱柱
      g.add(plMesh(new THREE.CylinderGeometry(1.3, 1.3, 2.4, 6, 2, true), c, 0.35));
      break;
    case '34': // 正棱锥
      g.add(plMesh(new THREE.ConeGeometry(1.5, 2.4, 4, 3, true), c, 0.35));
      break;
    case '35': // 长方体
      g.add(plMesh(new THREE.BoxGeometry(2.8, 1.7, 1.9, 2, 2, 2), c, 0.32));
      break;
    case '36': { // 外接球与内切球
      g.add(plMesh(new THREE.BoxGeometry(2.2, 2.2, 2.2, 1, 1, 1), 0x9cc3ff, 0.35));
      g.add(plMesh(new THREE.SphereGeometry(1.905, 16, 10), c, 0.26));
      g.add(plMesh(new THREE.SphereGeometry(1.1, 14, 9), 0x9be7c4, 0.4));
      break;
    }
    case '37': { // 直线与圆
      g.add(plParam(t => plV(Math.cos(t) * 1.9, Math.sin(t) * 1.9, 0), 0, Math.PI * 2, 110, c));
      g.add(plLine([plV(-2.9, -1.5, 0), plV(2.9, 1.9, 0)], 0xff9db4, 0.9));
      break;
    }
    case '38': { // 圆的方程
      g.add(plParam(t => plV(Math.cos(t) * 1.8 + 0.4, Math.sin(t) * 1.8 - 0.2, 0), 0, Math.PI * 2, 110, c));
      g.add(plPoints([plV(0.4, -0.2, 0)], 0xffffff, 0.16));
      break;
    }
    case '39': // 椭圆
      g.add(plParam(t => plV(Math.cos(t) * 2.4, Math.sin(t) * 1.4, 0), 0, Math.PI * 2, 140, c));
      break;
    case '40': // 双曲线
      g.add(plParam(t => plV(Math.cosh(t) * 1.5, Math.sinh(t) * 1.0, 0), -1.5, 1.5, 70, c));
      g.add(plParam(t => plV(-Math.cosh(t) * 1.5, Math.sinh(t) * 1.0, 0), -1.5, 1.5, 70, c));
      g.add(plSegments([plV(-2.8, -1.9, 0), plV(2.8, 1.9, 0), plV(-2.8, 1.9, 0), plV(2.8, -1.9, 0)], dim, 0.25));
      break;
    case '41': // 抛物线
      g.add(plParam(t => plV(t * t * 0.32, t * 0.9, 0), -2.8, 2.8, 90, c));
      break;
    case '42': { // 古典概型
      const filled = [0, 2, 5, 7, 9, 11];
      for (let i = 0; i < 12; i++) {
        const x = (i % 4) - 1.5;
        const z = Math.floor(i / 4) - 1;
        const on = filled.includes(i);
        g.add(plBox(x, 0, z * 1.1, 0.62, 0.06, 0.62, on ? c : 0x3d557d, on ? 0.75 : 0.3));
      }
      break;
    }
    case '43': { // 二项分布
      const N = 8, p = 0.5;
      const C = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1); return r; };
      for (let k = 0; k <= N; k++) {
        const h = C(N, k) * Math.pow(p, k) * Math.pow(1 - p, N - k) * 9;
        g.add(plBox(k - 4, h / 2, 0, 0.42, h, 0.42, c, 0.6));
      }
      break;
    }
    case '44': { // 均值与方差
      const xs = [-2, -0.6, 1.1, 2.2];
      const mu = xs.reduce((a, b) => a + b, 0) / xs.length;
      g.add(plSegments([plV(-3, 0, 0), plV(3, 0, 0)], dim, 0.4));
      g.add(plSegments([plV(mu, -0.5, 0), plV(mu, 0.5, 0)], 0xffffff, 0.6));
      g.add(plPoints(xs.map(v => plV(v, 0, 0)), c, 0.16));
      xs.forEach(v => g.add(plBox((v + mu) / 2, 0.32, 0, Math.abs(v - mu) || 0.02, 0.05, 0.05, 0x9be7c4, 0.5)));
      break;
    }
    case '45': { // 定积分
      const f = x => 0.18 * x * x;
      for (let i = 0; i < 8; i++) {
        const x0 = 0.2 + i * 0.3;
        const h = f(x0 + 0.15);
        g.add(plBox(x0 + 0.15, h / 2, 0, 0.26, h, 0.26, c, 0.22));
      }
      g.add(plFunc(f, -3, 3, 70, c));
      break;
    }
    case '46': { // 矩阵与空间变换
      for (let i = -1; i <= 1; i++) {
        g.add(plSegments([plV(-2, 0, i), plV(2, 0, i), plV(i, 0, -2), plV(i, 0, 2)], dim, 0.3));
      }
      for (let i = -1; i <= 1; i++) {
        g.add(plSegments([plV(-2 + i * 0.9, 1.6, -2 + i * 0.4), plV(2 - i * 0.5, 1.6, 2 + i * 0.9),
                          plV(i * 0.9 - 2, 1.6, 2 - i * 0.4), plV(2 + i * 0.5, 1.6, -2 - i * 0.9)], c, 0.3));
      }
      break;
    }
    case '47': // 偏导数：抛物面
      g.add(plSurface((u, v) => plV(u, (u * u + v * v) * 0.35 - 1.6, v), -2, 2, -2, 2, 14, 14, c, 0.22));
      break;
    case '48': // 椭球面
      g.add(plSurface((u, v) => plV(
        Math.sin(u) * Math.cos(v) * 2.2,
        Math.cos(u) * 1.5,
        Math.sin(u) * Math.sin(v) * 1.7
      ), 0, Math.PI, 0, Math.PI * 2, 12, 20, c, 0.2));
      break;
    case '49': // 单叶双曲面
      g.add(plSurface((u, v) => plV(
        Math.cosh(u) * Math.cos(v) * 1.1,
        u * 1.1,
        Math.cosh(u) * Math.sin(v) * 1.1
      ), -1.1, 1.1, 0, Math.PI * 2, 12, 24, c, 0.18));
      break;
    case '50': // 莫比乌斯环
      g.add(plSurface((u, v) => {
        const R = 1.9, w = 0.62;
        return plV((R + w * v * Math.cos(u / 2)) * Math.cos(u),
                   w * v * Math.sin(u / 2),
                   (R + w * v * Math.cos(u / 2)) * Math.sin(u));
      }, 0, Math.PI * 2, -1, 1, 40, 4, c, 0.22));
      break;
    case '51': { // 素数判定：Ulam 螺旋
      const isPrime = (m) => { if (m < 2) return false; for (let i = 2; i * i <= m; i++) if (m % i === 0) return false; return true; };
      const pts = [];
      let x = 0, y = 0, dx = 0, dy = -1, step = 1, count = 1;
      for (let i = 1; i <= 460; i++) {
        if (isPrime(i)) pts.push(plV(x * 0.17, 0.2, y * 0.17));
        if (x === y || (x < 0 && x === -y) || (x > 0 && x === 1 - y)) {
          const t = dx; dx = -dy; dy = t;
          if (dy === 1) step++;
        }
        x += dx; y += dy;
        count++;
      }
      g.add(plPoints(pts, c, 0.09));
      break;
    }
    case '52': { // 模运算：表盘
      g.add(plParam(t => plV(Math.cos(t) * 1.9, 0, Math.sin(t) * 1.9), 0, Math.PI * 2, 100, dim, 0.45));
      const pts = [];
      for (let i = 0; i < 11; i++) pts.push(plV(Math.cos(i / 11 * Math.PI * 2) * 1.9, 0, Math.sin(i / 11 * Math.PI * 2) * 1.9));
      g.add(plPoints(pts, c, 0.13));
      g.add(plArrow(plV(0, 0, 0), plV(Math.cos(7 / 11 * Math.PI * 2) * 1.9, 0, Math.sin(7 / 11 * Math.PI * 2) * 1.9), c));
      break;
    }
    case '53': { // 柯西序列
      const pts = [];
      for (let i = 0; i < 16; i++) pts.push(plV(-2.8 + i * 0.38, 0, (Math.random() - 0.5) * 0.05));
      g.add(plPoints(pts, c, 0.13));
      g.add(plSegments([plV(-3, 0.35, 0), plV(3, 0.35, 0), plV(-3, -0.35, 0), plV(3, -0.35, 0)], 0x9be7c4, 0.35));
      break;
    }
    case '54': // 度量空间：Lp 单位球
    case '55': { // 巴拿赫空间
      const lp = (p) => plParam(t => {
        const ct = Math.cos(t), st = Math.sin(t);
        const r = Math.pow(Math.pow(Math.abs(ct), p) + Math.pow(Math.abs(st), p), -1 / p) * 1.8;
        return plV(ct * r, 0, st * r);
      }, 0, Math.PI * 2, 160, c);
      g.add(lp(n === '54' ? 1.6 : 1));
      g.add(plParam(t => plV(Math.cos(t) * 1.8, 0, Math.sin(t) * 1.8), 0, Math.PI * 2, 100, dim, 0.3));
      break;
    }
    case '56': { // 泰勒展开
      g.add(plFunc(x => Math.sin(x) * 1.9, -3, 3, 120, 0xffffff, null, 0.55));
      g.add(plFunc(x => (x - x * x * x / 6) * 1.9, -3, 3, 80, c));
      g.add(plFunc(x => (x - x * x * x / 6 + Math.pow(x, 5) / 120) * 1.9, -3, 3, 80, 0x9be7c4, null, 0.55));
      break;
    }
    case '57': { // 傅里叶级数
      const square = x => (Math.sin(x) >= 0 ? 1 : -1);
      g.add(plFunc(square, -3, 3, 400, 0xffffff, null, 0.35));
      g.add(plFunc(x => Math.sin(x) * 1.6, -3, 3, 120, c, null, 0.5));
      g.add(plFunc(x => (Math.sin(x) + Math.sin(3 * x) / 3 + Math.sin(5 * x) / 5) * 1.4, -3, 3, 200, 0x9be7c4, null, 0.7));
      break;
    }
    case '58': { // 正态分布
      const f = x => Math.exp(-(x * x) / 2) * 2.0;
      g.add(plFunc(f, -3, 3, 120, c));
      g.add(plSegments([plV(-1, 0, 0), plV(-1, 1.25, 0), plV(1, 0, 0), plV(1, 1.25, 0)], dim, 0.3));
      for (let x = -1; x <= 1; x += 0.2) g.add(plBox(x, f(x) / 2, 0, 0.06, f(x), 0.06, c, 0.16));
      break;
    }
    case '59': { // 中心极限定理
      const bell = x => Math.exp(-(x * x) / 1.4) * 1.9;
      for (let i = 0; i < 13; i++) {
        const x = -3 + i * 0.5;
        g.add(plBox(x, bell(x) / 2, 0, 0.34, bell(x), 0.34, c, 0.3));
      }
      g.add(plFunc(bell, -3, 3, 100, 0xffffff, null, 0.4));
      break;
    }
    case '60': { // 方向场
      for (let x = -2.7; x <= 2.7; x += 0.6) {
        for (let z = -2.7; z <= 2.7; z += 0.6) {
          const k = Math.sin(x) * Math.cos(z) * 1.4;
          const len = 0.3;
          g.add(plSegments([plV(x - len, 0, z - len * k), plV(x + len, 0, z + len * k)], c, 0.35));
        }
      }
      break;
    }
    case '61': { // 洛伦兹吸引子
      const pts = [];
      let x = 0.1, y = 0, z = 0;
      for (let i = 0; i < 5200; i++) {
        const dx = 10 * (y - x);
        const dy = x * (28 - z) - y;
        const dz = x * y - (8 / 3) * z;
        x += dx * 0.004;
        y += dy * 0.004;
        z += dz * 0.004;
        pts.push(plV(x * 0.09, (z - 25) * 0.09, y * 0.09));
      }
      g.add(plLine(pts, c, 0.5));
      break;
    }
    default:
      break;
  }

  return g;
}

// plFunc 的变体：显式映射（用于把任意 x 范围挪到画面中间）
function plFuncx(fn, x0, x1, n, color, map, opacity) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n;
    pts.push(map(x));
  }
  return plLine(pts, color, opacity);
}

/* ---------- 视窗生命周期 ---------- */

let plotRenderer = null;
let plotScene = null;
let plotCamera = null;
let plotPivot = null;
let viewerOpen = false;
let viewerTopic = 0;

function initPlot() {
  if (plotRenderer) return;
  plotRenderer = new THREE.WebGLRenderer({ canvas: plotCanvas, antialias: true });
  plotRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  plotRenderer.setClearColor(0x05080f, 1);
  plotRenderer.outputColorSpace = THREE.SRGBColorSpace;
  plotScene = new THREE.Scene();
  plotCamera = new THREE.PerspectiveCamera(42, 1, 0.1, 80);
  plotCamera.position.set(5.6, 3.5, 7.2);
  plotCamera.lookAt(0, 0.1, 0);
  plotPivot = new THREE.Group();
  plotScene.add(plotPivot);
}

function resizePlot() {
  if (!plotRenderer) return;
  const w = plotCanvas.clientWidth || 398;
  const h = plotCanvas.clientHeight || 268;
  plotRenderer.setSize(w, h, false);
  plotCamera.aspect = w / h;
  plotCamera.updateProjectionMatrix();
}

function clearPlot() {
  while (plotPivot.children.length) {
    const o = plotPivot.children[plotPivot.children.length - 1];
    plotPivot.remove(o);
    o.traverse((c) => {
      if (c.geometry) c.geometry.dispose();
      if (c.material) {
        if (c.material.map) c.material.map.dispose();
        c.material.dispose();
      }
    });
  }
}

function renderPlot(index) {
  initPlot();
  clearPlot();
  viewerTopic = index;
  const item = KNOWLEDGE[index];

  plotPivot.rotation.set(0, -0.55, 0);
  plotPivot.add(plGrid(3, 0.75));
  plotPivot.add(plAxes(3));
  plotPivot.add(buildTopicPlot(item.n, item.c));

  inspCat.textContent = item.g;
  inspIdxEl.textContent = item.n + ' / ' + String(KNOWLEDGE.length).padStart(2, '0');
  inspNameEl.textContent = item.name;
  inspFormulaEl.textContent = item.f;
  inspDescEl.textContent = item.d;

  resizePlot();
}

function openViewer(index) {
  viewerOpen = true;
  state.focus = true;
  state.userVel = 0;
  inspEl.classList.add('open');
  inspEl.setAttribute('aria-hidden', 'false');
  renderPlot(index);
}

function closeViewer() {
  if (!viewerOpen) return;
  viewerOpen = false;
  state.focus = false;
  inspEl.classList.remove('open');
  inspEl.setAttribute('aria-hidden', 'true');
}

function toggleViewer(index) {
  if (viewerOpen && viewerTopic === index) { closeViewer(); return; }
  openViewer(index);
}

document.getElementById('insp-close').addEventListener('click', closeViewer);
inspEl.addEventListener('pointerdown', (e) => e.stopPropagation());

const pickRay = new THREE.Raycaster();
const pickNdc = new THREE.Vector2();

function pickKnowledge(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  pickNdc.set(
    ((clientX - rect.left) / rect.width) * 2 - 1,
    -((clientY - rect.top) / rect.height) * 2 + 1
  );
  pickRay.setFromCamera(pickNdc, camera);
  const hits = pickRay.intersectObjects(kbLayer.children.filter((o) => o.visible), false);
  for (const hit of hits) {
    const card = kbCards.find((k) => k.sprite === hit.object);
    if (card) return card.topic;
  }
  return -1;
}

function handleSceneClick(x, y) {
  const topic = pickKnowledge(x, y);
  if (topic >= 0) toggleViewer(topic);
  else closeViewer();
}

/* ============================ 输入 / 状态 ============================ */

const state = {
  u: 0.02,
  userVel: 0,
  dragging: false,
  pendingDragY: 0,
  pointerId: null,
  firstPerson: false,
  focus: false,          // 打开知识检视时冻结航道
  bank: 0,               // 转弯侧倾
  downX: 0,
  downY: 0,
  downT: 0,
  clickArmed: false
};

const keys = new Set();
const camPos = new THREE.Vector3();
const lookAt = new THREE.Vector3();
let camSnap = true;

const hint = document.getElementById('hint');
const loading = document.getElementById('loading');

function setFirstPerson(v) {
  state.firstPerson = v;
  astronautRoot.visible = !v;
  camSnap = true;
  hint.innerHTML = v
    ? '<b>W / S</b> · 滚轮 · 上下拖拽　=　前进 / 后退　　　<b>V</b>　回到第三人称'
    : '<b>W / S</b> · 滚轮 · 上下拖拽　=　前进 / 后退　　　<b>V</b>　切换视角';
}

// ---- 指针拖拽：只影响前后 ----
canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== undefined && e.button !== 0) return;
  state.dragging = true;
  state.pointerId = e.pointerId;
  state.pendingDragY = 0;
  state.lastClientY = e.clientY;
  state.downX = e.clientX;
  state.downY = e.clientY;
  state.downT = performance.now();
  state.clickArmed = true;
  try { canvas.setPointerCapture(e.pointerId); } catch { /* 合成事件或已释放 */ }
  document.body.classList.add('dragging');
});

// 点一下（没有拖动）= 选知识卡 / 收起
canvas.addEventListener('pointerup', (e) => {
  if (!state.clickArmed) return;
  state.clickArmed = false;
  const moved = Math.hypot(e.clientX - state.downX, e.clientY - state.downY);
  if (moved < 8 && performance.now() - state.downT < 800) {
    handleSceneClick(e.clientX, e.clientY);
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!state.dragging || e.pointerId !== state.pointerId) return;
  state.pendingDragY += e.clientY - state.lastClientY;
  state.lastClientY = e.clientY;
});

function endDrag(e) {
  if (!state.dragging) return;
  state.dragging = false;
  state.lastClientY = 0;
  if (state.pointerId !== null) {
    try { canvas.releasePointerCapture(state.pointerId); } catch { /* 已释放 */ }
  }
  state.pointerId = null;
  document.body.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('lostpointercapture', endDrag);

// ---- 滚轮：上 = 前，下 = 后 ----
canvas.addEventListener('wheel', (e) => {
  state.userVel = clamp(
    state.userVel - e.deltaY * CONFIG.WHEEL_SENSITIVITY,
    -CONFIG.MAX_REVERSE,
    CONFIG.MAX_FORWARD
  );
}, { passive: true });

// ---- 键盘 ----
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'escape') { closeViewer(); return; }
  if (k === 'v') { setFirstPerson(!state.firstPerson); return; }
  if (k === 'w' || k === 's' || k === 'arrowup' || k === 'arrowdown') {
    keys.add(k);
    e.preventDefault();
  }
});
window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

/* =============================== 主循环 =============================== */

const clock = new THREE.Clock();
const tmpPos = new THREE.Vector3();
const tmpTan = new THREE.Vector3();
const prevTan = new THREE.Vector3();
const basisRight = new THREE.Vector3();
const basisUp = new THREE.Vector3();
const basisFwd = new THREE.Vector3();
const basisMat = new THREE.Matrix4();
const targetQuat = new THREE.Quaternion();
const rollQuat = new THREE.Quaternion();
const desiredCam = new THREE.Vector3();
const desiredLook = new THREE.Vector3();
let elapsed = 0;
let hasPrevTan = false;

function updateParticles(lane, time) {
  const { table, phases, offsets, count, geo } = lane;
  const pos = geo.attributes.position.array;
  const samples = CONFIG.PARTICLE_SAMPLES;

  for (let i = 0; i < count; i++) {
    let phase = phases[i] + time * CONFIG.PARTICLE_FLOW_SPEED;
    phase -= Math.floor(phase);
    const idx = (phase * samples) | 0;
    const p = table[idx];

    pos[i * 3] = p.x + offsets[i * 3];
    pos[i * 3 + 1] = p.y + offsets[i * 3 + 1];
    pos[i * 3 + 2] = p.z + offsets[i * 3 + 2];
  }
  geo.attributes.position.needsUpdate = true;
}

function resize() {
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  starUniforms.uPixelRatio.value = renderer.getPixelRatio();
  for (const lane of lanes) lane.points.material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
}
window.addEventListener('resize', resize);
window.addEventListener('resize', () => { if (viewerOpen) resizePlot(); });

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  /* ---- 1. 输入 → 速度 ---- */
  if (state.pendingDragY !== 0) {
    state.userVel = clamp(
      state.userVel - state.pendingDragY * CONFIG.DRAG_SENSITIVITY,
      -CONFIG.MAX_REVERSE,
      CONFIG.MAX_FORWARD
    );
    state.pendingDragY = 0;
  }
  // 松手后平滑回到 0，也就是回到自动前进
  state.userVel *= Math.exp(-dt / CONFIG.RELEASE_TAU);

  let keyVel = 0;
  if (keys.has('w') || keys.has('arrowup')) keyVel += CONFIG.KEY_SPEED;
  if (keys.has('s') || keys.has('arrowdown')) keyVel -= CONFIG.KEY_SPEED;

  const speed = state.focus ? 0 : (CONFIG.AUTO_SPEED + state.userVel + keyVel);

  /* ---- 2. 沿路径前进 ---- */
  state.u += (speed * dt) / rideLane.length;
  state.u -= Math.floor(state.u);

  rideLane.curve.getPointAt(state.u, tmpPos);
  rideLane.curve.getTangentAt(state.u, tmpTan).normalize();
  // 悬浮一点，让光轨落在脚下而不是从身体中间穿过
  tmpPos.addScaledVector(laneUp, CONFIG.RIDE_HOVER);

  /* ---- 3. 宇航员朝向 ---- */
  basisRight.crossVectors(laneUp, tmpTan).normalize();
  basisUp.crossVectors(tmpTan, basisRight).normalize();
  basisMat.makeBasis(basisRight, basisUp, tmpTan);
  targetQuat.setFromRotationMatrix(basisMat);

  // 转弯时轻微侧倾，像贴着通道滑行
  if (hasPrevTan) {
    const cross = prevTan.x * tmpTan.z - prevTan.z * tmpTan.x;
    const dot = clamp(prevTan.dot(tmpTan), -1, 1);
    const yawRate = Math.atan2(cross, dot) / Math.max(dt, 1e-4);
    const targetBank = clamp(-yawRate * 0.35, -0.32, 0.32);
    state.bank += (targetBank - state.bank) * (1 - Math.exp(-dt * 4));
  }
  prevTan.copy(tmpTan);
  hasPrevTan = true;

  rollQuat.setFromAxisAngle(basisFwd.copy(tmpTan), state.bank);
  astronautRoot.quaternion.slerp(targetQuat.premultiply(rollQuat), 1 - Math.exp(-dt * 9));
  astronautRoot.position.copy(tmpPos);

  // 呼吸感的轻微浮动
  const bob = Math.sin(elapsed * 2.1) * 0.035 + Math.sin(elapsed * 0.7) * 0.02;
  astronautModel.position.y = bob;

  /* ---- 4. 相机 ---- */
  if (state.firstPerson) {
    desiredCam.copy(tmpPos)
      .addScaledVector(laneUp, CONFIG.FP_EYE_HEIGHT + bob * 0.35)
      .addScaledVector(tmpTan, 0.34);
    desiredLook.copy(tmpPos)
      .addScaledVector(tmpTan, CONFIG.FP_LOOK_AHEAD)
      .addScaledVector(laneUp, CONFIG.FP_EYE_HEIGHT - 0.04);
  } else {
    desiredCam.copy(tmpPos)
      .addScaledVector(tmpTan, -CONFIG.CAM_DISTANCE)
      .addScaledVector(laneUp, CONFIG.CAM_HEIGHT);
    desiredLook.copy(tmpPos)
      .addScaledVector(tmpTan, CONFIG.CAM_LOOK_AHEAD)
      .addScaledVector(laneUp, 1.55);
  }

  if (camSnap) {
    camPos.copy(desiredCam);
    lookAt.copy(desiredLook);
    camSnap = false;
  } else {
    const k = 1 - Math.exp(-dt * CONFIG.CAM_LERP);
    camPos.lerp(desiredCam, k);
    lookAt.lerp(desiredLook, 1 - Math.exp(-dt * CONFIG.CAM_LERP * 1.6));
  }

  camera.position.copy(camPos);
  camera.lookAt(lookAt);

  /* ---- 5. 更新发光 / 点云 ---- */
  for (const lane of lanes) {
    lane.core.material.uniforms.uTime.value = elapsed;
    lane.halo.material.uniforms.uTime.value = elapsed;
    lane.glow.material.uniforms.uTime.value = elapsed;
    updateParticles(lane, elapsed);
  }

  starUniforms.uTime.value = elapsed;
  skyUniforms.uTime.value = elapsed;

  /* ---- 6. 知识流：卡片沿航道飘、经过时刷新左下读数 ---- */
  updateKnowledge(dt, speed, elapsed);

  /* ---- 7. 天空永远跟着相机 ---- */
  skyGroup.position.copy(camera.position);

  // 地球自转；太阳方向要换算到地球局部坐标（它带着黄赤交角在转）
  if (earthMesh) {
    earthMesh.rotation.y = elapsed * 0.03;
    earthMat.uniforms.uTime.value = elapsed;
    earthMat.uniforms.uSunDir.value
      .copy(earthSunWorld)
      .applyQuaternion(earthMesh.quaternion.clone().invert())
      .normalize();
  }

  renderer.render(scene, camera);

  /* ---- 8. 知识检视打开时：坐标图自转并单独渲染 ---- */
  if (viewerOpen) {
    plotPivot.rotation.y += dt * 0.32;
    plotRenderer.render(plotScene, plotCamera);
  }
}

/* ================================ 启动 ================================ */

resize();
renderer.setAnimationLoop(tick);

// 配了外部天空盒就异步换上；失败会退回程序化天空
applyExternalSkybox();

// 支持 ?k=12 直接打开某个知识点（方便分享/截图）
(() => {
  const k = new URLSearchParams(location.search).get('k');
  if (!k) return;
  const idx = KNOWLEDGE.findIndex((it) => it.n === String(k).padStart(2, '0'));
  if (idx >= 0) window.setTimeout(() => openViewer(idx), 800);
})();

// 首帧渲染后收掉加载遮罩
requestAnimationFrame(() => {
  loading.classList.add('fade');
  window.setTimeout(() => { loading.hidden = true; }, 750);
  window.__DTU_BOOT = true;
});

// 调试用：控制台可直接改参数
window.DTU = { CONFIG, scene, camera, renderer, lanes, astronautRoot, state, setFirstPerson, openViewer, closeViewer, renderPlot, plotPivot: () => plotPivot };

}
</script>
